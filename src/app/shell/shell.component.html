<!-- Desktop -->
<div *ngIf="!isSession && !showTabletSlidebar" class="left-right-wrap">
    <div class="large-left" [ngClass]="{'collapsed':!expanded,'expanded':expanded}">
        <!-- <ng-container *ngIf="expanded">
            <ng-template [ngTemplateOutlet]="upperSideNav"></ng-template>
        </ng-container>
       
        <div class="collapse">
            <mat-icon class="collapse-icon " (click)="toggleSlidebar()">arrow_back</mat-icon>
        </div> -->
        <ng-container>
          <ng-template [ngTemplateOutlet]="upperSideNav"></ng-template>
      </ng-container>
     
      <div class="collapse">
          <mat-icon class="collapse-icon " (click)="toggleSlidebar()">arrow_back</mat-icon>
      </div>
    </div>
    
    <div class="large-right" [ngClass]="{'collapsed':!expanded,'expanded':expanded}">      
        <ng-template [ngTemplateOutlet]="maincontent"></ng-template>
    </div>
</div>
<!-- End Desktop -->

<!-- Tablet -->
<div class="d-flex flex-column main-container" *ngIf="showTabletSlidebar && !isSession">
    <mat-sidenav-container>
        <mat-sidenav #sidenav mode="push" ngClass.gt-sm="has-border">
            <nav>
                <ng-template [ngTemplateOutlet]="upperSideNav"></ng-template>
            </nav>
        </mat-sidenav>
        <mat-sidenav-content>
            <app-header [sidenav]="sidenav"></app-header>
            <ng-template [ngTemplateOutlet]="maincontent"></ng-template>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
<!-- End Tablet -->

<!-- Main content of the page here -->
<ng-template #maincontent>
    <div id="notify-scroll"></div>
    <app-info-bar class="no-print" ></app-info-bar>
    <app-notify-bar></app-notify-bar>

    <router-outlet></router-outlet>
</ng-template>

<!-- session-ended -->
<div *ngIf="isSession">
    <router-outlet></router-outlet>
</div>
