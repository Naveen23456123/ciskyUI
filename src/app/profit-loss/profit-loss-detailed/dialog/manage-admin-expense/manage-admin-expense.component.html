<div class="dialog">
    <mat-card>
        <h3 mat-dialog-title class="justify-content-between align-items-center"> Admin Expenses
            <button class="popup-close-btn float-end" mat-icon-button mat-dialog-close>
                <mat-icon>close</mat-icon>
            </button>
        </h3>
        <mat-dialog-content>
            <mat-card-content>
                <div class="load-wrap" *ngIf="isLoading">
                    <app-loader [IsLoading]="isLoading"></app-loader>
                </div>
                <div class="wrapper">
                    <div class=" mt-3">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <mat-form-field>
                                    <mat-label>Select Expense</mat-label>
                                    <mat-select [(ngModel)]="selectedExpenseId">
                                        <mat-option *ngFor="let e of availableExpenses" [value]="e.id">{{ e.value }}
                                        </mat-option>
                                    </mat-select>
                                </mat-form-field>

                            </div>
                            <div class="col-md-1">
                                <button mat-icon-button [disabled]="!selectedExpenseId" type="button"
                                    matTooltip="Add Expense" (click)="addExpense()">
                                    <mat-icon>add_circle</mat-icon>
                                </button>
                            </div>
                            <div class="col-md-5 total-summary mat-elevation-z2 text-end ">
                                <div class=" fs-5 fw-bold mb-2">Total Amount : </div>
                                <div class="total-value ">{{ totalAmount | formatCurrency }}</div>
                            </div>
                        </div>

                        <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 full-width">

                            <!-- Expense Name Column -->
                            <ng-container matColumnDef="value">
                                <th mat-header-cell *matHeaderCellDef> Particulars</th>
                                <td mat-cell *matCellDef="let element"> {{ element.value }} </td>
                            </ng-container>

                            <!-- Amount Column -->
                            <ng-container matColumnDef="amount">
                                <th mat-header-cell *matHeaderCellDef> Expense Amount </th>
                                <td class="mt-0 mb-0" mat-cell *matCellDef="let element">
                                    <mat-form-field *ngIf="element.isEditing" class="amount-field">
                                        <input matInput type="number" [(ngModel)]="element.amount"
                                            (ngModelChange)="updateTotal()" placeholder="Enter amount" />
                                    </mat-form-field>
                                </td>
                            </ng-container>

                            <!-- Actions Column -->
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef> Actions </th>
                                <td mat-cell *matCellDef="let element">

                                    <app-delete-btn matTooltip="Delete"
                                        (click)="deleteExpense(element)"></app-delete-btn>

                                </td>
                            </ng-container>

                            <!-- Table Header & Rows -->
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                        </table>
                    </div>

                </div>
            </mat-card-content>
        </mat-dialog-content>
        <mat-dialog-actions align="end">
            <div class="row control-div">
                <div class=" button-row" align="right">
                    <button class="cancel-btn" mat-stroked-button mat-dialog-close color="default">Cancel</button>
                    <button class="submit-btn" mat-flat-button (click)="submit()" color="primary">
                        Add to Sheet
                    </button>
                </div>
            </div>
        </mat-dialog-actions>
    </mat-card>
</div>
