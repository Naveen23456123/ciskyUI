<app-upload-data [isUploading]="isImporting"
 [templateColumns]="allColumnsData"
 [errorLoadingCSV]="errors"
  (onImportClick)="importing($event)" >
    <div metadata>
        <div class="row ">
            <div class="col-md-6">
                <span class="msg-note">Information</span> 
                <ul class="mt-2"> 
                    <li><b>Project code</b> should be unique.</li>
                    <li><b>Guarantee, Release & Expiry Date</b> should be provided.</li>
                </ul>
            </div>
            
        </div>
    </div>
</app-upload-data>
