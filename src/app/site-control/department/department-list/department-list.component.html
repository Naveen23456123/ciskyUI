<div class="container">
  <mat-card>
      <mat-card-content>
        <div class="table-title-row">
          <div class="row col-md-12 content-center">
            <div class="col-md-9">
              <app-search-bar-controls [isSubCompany]="true" [isAny]="true"
                (OnSubCompanyChange)="filterChange($event)"
                (OnAnyChange)="filterChange($event)"
                (OnClear)="clear()"
                  searchByAnyPlaceholder="Department / SubCompany" ></app-search-bar-controls> 
            </div>         
            <div class="col-md-3 button-row main-btn-row d-flex justify-content-end">         
              <app-upload-btn routerLink="upload-dept" ></app-upload-btn>          
                  <button class="title-btn " type="button" routerLink="create"  mat-mini-fab color="primary">
                    <mat-icon>add box</mat-icon> Department
                  </button>      
            </div>
          </div>
        </div>
      </mat-card-content>
     </mat-card>
    <mat-card class="wrapper">
        <mat-card-content>
            <ng-container *ngIf="isLoading; else checkNoData">
              <app-empty-table-skltn></app-empty-table-skltn>
            </ng-container>

            <ng-template #checkNoData>
              <ng-container *ngIf="dataSource?.data?.length === 0; else showTable">
                <app-no-data message="No Department(s) details found at this moment !!"></app-no-data>
              </ng-container>
            </ng-template>
             <ng-template #showTable> 
                <div  class="mat-elevation-z8">
                  <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
                
                    <ng-container matColumnDef="serial">
                      <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                      <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                    </ng-container> 
                
                    <!-- contractName Column -->
                    <ng-container matColumnDef="name">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header> Department Name </th>
                      <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                    </ng-container>
                
                    <!-- Name Column -->
                    <ng-container matColumnDef="subcompanyname">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header> Sub Company Name </th>
                      <td mat-cell *matCellDef="let row"> {{row.companyname}} </td>
                    </ng-container>                     
                    
                    <!-- con_personName Column -->
                    <ng-container matColumnDef="action">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                      <td mat-cell *matCellDef="let row"> 
                        <div class="button-row">                              
                          <app-edit-btn [routerLink]="['/department/edit',row.id]" [state]="row" ></app-edit-btn>                              
                          <app-delete-btn [state]="row" [routerLink]="['/department/delete',row.id]" ></app-delete-btn>
                    </div>
                      </td>
                    </ng-container>
                  
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr> 
                    <tr class="mat-row" *matNoDataRow>
                      <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                        No Department found at this moment.</td>
                    </tr>
                  </table>
                  <mat-paginator [length]="resultsLength" [pageSize]="pageSize" [pageSizeOptions]="pagination" showFirstLastButtons>
                  </mat-paginator>
                </div>       
            </ng-template>
        </mat-card-content>
    </mat-card>
</div>
<router-outlet></router-outlet>
