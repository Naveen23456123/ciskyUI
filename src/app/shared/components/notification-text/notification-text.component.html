<div class="dialog">
    <mat-card>
        <mat-card-title>{{dialogTitle}}</mat-card-title>
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="wrapper">
                <form [formGroup]="textform" (submit)="submit()">
                    <div class="row control-div">
                        <div class="col-md-6">
                            <mat-form-field>
                                <mat-label>Variables</mat-label>
                                <mat-select (selectionChange)="variablechange($event)"  formControlName="variable"
                                    >
                                    <mat-option *ngFor="let sfield of variableList" [value]="sfield.value">
                                        {{sfield.text}}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col-md-6" align="right">
                            <button (click)="setdefault()" type="button" mat-stroked-button>Reset To Default</button>
                        </div>
                    </div>
                    <div class="row ">
                        <div class="col-md-12">
                            <mat-form-field class="mat-full-width" appearance="fill">
                                <mat-label>Notification Text</mat-label>
                                <textarea class="notify-text" formControlName="notificationtext" matInput></textarea>
                              </mat-form-field>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 button-row" align="right">
                            <button mat-raised-button mat-dialog-close color="default">Cancel</button>
                            <button mat-raised-button type="submit" color="primary">Save</button>
                        </div>
                    </div>
                </form>
            </div>
        </mat-card-content>
    </mat-card>
</div>
