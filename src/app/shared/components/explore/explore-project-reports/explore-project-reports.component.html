<mat-card>
  <mat-card-content class="px-0">
   <ng-container *ngIf=" isLoading; else checkNoData">
      <app-empty-table-skltn></app-empty-table-skltn>
    </ng-container>
    <ng-template #checkNoData>
      <ng-container *ngIf="dataSource?.data?.length === 0; else showTable">
        <app-no-data message="No Report found at this moment !!"></app-no-data>
      </ng-container>
    </ng-template>
    <ng-template #showTable>
      <div class="mat-elevation-z8">
            <div class="row col-md-12 control-div">
              <div class="col-md-4 ">
                <mat-form-field>
                  <mat-icon matPrefix>search</mat-icon>
                  <mat-label>Report Type / Name / Letter  No. </mat-label>
                  <input matInput (keyup)="applyFilter($event)" placeholder="" #input>
                </mat-form-field>
              </div>
            </div>
            <div class="table-container">   
              <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
            
                <ng-container matColumnDef="serial">
                  <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                  <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                </ng-container>
            
                <!-- contractName Column -->
                <ng-container matColumnDef="type">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Type </th>
                  <td mat-cell *matCellDef="let row"> {{row.type}} </td>
                </ng-container>
            
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Name </th>
                  <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                </ng-container>                      
              
                <ng-container matColumnDef="no">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> No. </th>
                  <td mat-cell *matCellDef="let row">{{row.no }} </td>
                </ng-container>
                
                <ng-container matColumnDef="letterno">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Letter No.</th>
                  <td mat-cell *matCellDef="let row">{{row.letterno }} </td>
                </ng-container> 
                <ng-container matColumnDef="date">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Date</th>
                  <td mat-cell *matCellDef="let row">{{row.date  | formatDate}} </td>
                </ng-container>
              
                <ng-container matColumnDef="file">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> File</th>
                  <td mat-cell *matCellDef="let row"> 
                    <app-file-icon [link]="!!row.docaddress" (clickEvent)="viewPdf(row.docaddress)"></app-file-icon>
                  </td>
                </ng-container> 
              
                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                  No Report(s) Detail found at this moment.</td>
              </tr>    
              </table>
              <mat-paginator [length]="resultsLength" [pageSize]="pageSize" 
              [pageSizeOptions]="pagination" showFirstLastButtons></mat-paginator> 
            </div>  
        </div>
    </ng-template>
  </mat-card-content>
</mat-card>
