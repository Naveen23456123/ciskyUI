<div class="container">
    
    <mat-card>
        <mat-card-title>
            <div class="card-title-row">
                <span class="sub-heading">{{title}} Letter(s)</span>               
              </div>
        </mat-card-title>
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="wrapper" *ngIf="!isLoading">                

                <div class="mat-elevation-z8">
                    
                      <div class="table-title-row">
                        <mat-form-field>
                          <mat-label>Filter</mat-label>
                          <input matInput (keyup)="applyFilter($event)" placeholder="" #input>
                        </mat-form-field>
                        <div class="button-row">              
                          <app-upload-btn (clickEvent)="import()" ></app-upload-btn>
                           <button class="title-btn" type="button" (click)="add_letter()"  mat-mini-fab color="primary">
                             <mat-icon>add box</mat-icon>{{title}}  Letter
                          </button>     
                          <app-download-csv (clickEvent)="export()" ></app-download-csv>
                      </div>
                    </div> 
                      <div class="mat-elevation-z8">
                        <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
                      
                          <ng-container matColumnDef="serial">
                            <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                            <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                          </ng-container>
                      
                          <!-- contractName Column -->
                          <ng-container matColumnDef="letterno">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Letter No.</th>
                            <td mat-cell *matCellDef="let row"> {{row.letternumber}} </td>
                          </ng-container>
                      
                          <!-- Name Column -->
                          <ng-container matColumnDef="lettertype">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Letter Type </th>
                            <td mat-cell *matCellDef="let row"> {{row.lettertype}} </td>
                          </ng-container>                      
                        
                          <ng-container matColumnDef="letterdate">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Letter Date </th>
                            <td mat-cell *matCellDef="let row">{{row.letterdate | formatDate }} </td>
                          </ng-container>
                          <ng-container matColumnDef="subject">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Subject</th>
                            <td mat-cell *matCellDef="let row">{{row.subject}} </td>
                          </ng-container>
                          <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Status</th>
                            <td mat-cell *matCellDef="let row">{{row.status}} </td>
                          </ng-container>
                          <ng-container matColumnDef="view">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Details</th>
                            <td mat-cell *matCellDef="let row">
                              <app-view-btn (clickEvent)="viewletter(row.id)"></app-view-btn>
                            </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Action</th>
                            <td mat-cell *matCellDef="let row"> 
                              <div class="button-row">                               
                                <app-edit-btn (clickEvent)="editLetter(row)" ></app-edit-btn>                              
                                <app-delete-btn (clickEvent)="deleteLetter(row)"></app-delete-btn>
                              </div>
                            </td>
                          </ng-container>
                          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                          
                          <!-- Row shown when there is no matching data. -->
                          <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                              No Letters Details found at this moment.</td>
                          </tr>
                        </table>
                        <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="pagination" showFirstLastButtons>
                        </mat-paginator>
                        <!-- <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator> -->
                      </div>
                      
                      
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
