<div class="dialog" >
    <mat-card >        
        <h3 mat-dialog-title class="justify-content-between align-items-center"> Employee Document(s) 
            <button class="popup-close-btn float-end" mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
          </button> 
        </h3>        
        <mat-dialog-content class="mat-typography">
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="row">
                <mat-tab-group *ngIf="!isLoading" mat-stretch-tabs="false">
                    <mat-tab>
                    <ng-template mat-tab-label>
                        <mat-icon class="example-tab-icon mr-1rem">info</mat-icon>
                         View Document(s)
                    </ng-template> 
                    <div class="wrapper">
                        <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
                  
                            <ng-container matColumnDef="serial">
                              <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                              <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                            </ng-container>
                        
                            <!-- contractName Column -->
                            <ng-container matColumnDef="name">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                              <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                            </ng-container>
                            <ng-container matColumnDef="doc">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Document </th>
                                <td mat-cell *matCellDef="let row">
                                    <app-file-icon [link]="row.docaddress"></app-file-icon>
                                 </td>
                              </ng-container>
                            <ng-container matColumnDef="action">
                              <th mat-header-cell *matHeaderCellDef mat-sort-header> Action</th>
                              <td mat-cell *matCellDef="let row"> 
                                <div class="button-row">
                                 
                                  <button class="delete-table-btn" (click)="deleteDoc(row)" matTooltip="Delete" mat-mini-fab >
                                  <mat-icon>delete_forever</mat-icon> 
                                  </button>
                                </div>
                              </td>
                            </ng-container>
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                            
                            <tr class="mat-row" *matNoDataRow>
                                <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                                  No Documents Details found at this moment.</td>
                              </tr>
                          </table>  
                    </div>
                    </mat-tab>
                    <mat-tab>
                        <ng-template mat-tab-label>
                            <mat-icon class="example-tab-icon mr-1rem">add_circle</mat-icon>
                             New Document
                        </ng-template> 
                        <form [formGroup]="docForm" (submit)="submit()">
                            <div class="row col-md-12">
                                <div class="col-md-10 "> 
                                </div>
                                <div class="col-md-2">
                                    <div  class="table-title-row float-end">                               
                                        <div class="button-row">                                  
                                        <button mat-icon-button type="button" matTooltip="New Document" (click)="addDocControls()">
                                            <mat-icon>add_circle</mat-icon>
                                        </button>     
                                    </div>
                                    </div>
                                </div>  
                                <hr>
                                <div class="wrapper" formArrayName="files">
                                    <div *ngFor="let item of files.controls; let i = index" [formGroupName]="i">
                                        <div class="col-md-12 row control-div">                                                            
                                        <app-attach-file  (onfileUpload)="fileUploded($event,i)" [showRemove]="i !== 0" (clickEvent)="removeDocControl(i)" (textChanged)="onDocNameUpdate($event,i)" Uploadtitle="Document" ></app-attach-file>
                                        </div>
                                    </div>
                               </div>
                               <div class="row control-div">
                                <div class=" button-row" align="right">
                                      <button class="cancel-btn" mat-stroked-button mat-dialog-close color="default">Cancel</button>
                                      <button [ngClass]="docForm.valid? 'submit-btn':''" mat-flat-button [disabled]="!docForm.valid || isBtnClicked" color="primary">
                                        <span [hidden]="isBtnClicked">Submit</span> 
                                        <app-btn-loader [IsLoading]="isBtnClicked"></app-btn-loader>
                                        </button>
                              </div>
                              </div>
                            </div>
                        </form>
                    </mat-tab>
                </mat-tab-group>
            </div>
        </mat-card-content>
        </mat-dialog-content>
    </mat-card>
</div>
