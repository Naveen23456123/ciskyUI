<div class="container pr-0">
     <mat-card>
      <mat-card-content>
        <div class="table-title-row">
          <div class="row col-md-12 content-center">
            <div class="col-md-9">
              <app-search-bar-controls [isSubCompany]="true" [isProjects]="true"
              (OnSubCompanyChange)="compChange($event)" 
              (OnProjectChange)="projectChange($event)"
              (OnAnyChange)="anyChange($event)"
              (OnClear)="clear()"
              [isAny]="true" searchByAnyPlaceholder="Project Code or Name" ></app-search-bar-controls>
            </div>         
          <div class="col-md-3 button-row main-btn-row d-flex justify-content-end">         
            <app-upload-btn routerLink="dpr-upload" ></app-upload-btn>
             <button class="title-btn" type="button" routerLink="dpr-create"  mat-mini-fab color="primary">
              <mat-icon>add box</mat-icon> Project
             </button>
             <app-download-csv (clickEvent)="export()" ></app-download-csv>             
          </div>
        </div>
      </div>
      </mat-card-content>
     </mat-card>
    <mat-card >        
        <mat-card-content class="pr-0 pt-0 ps-0">
           
            <ng-container *ngIf="isSearchLoading || isLoading; else checkNoData">
              <app-empty-table-skltn></app-empty-table-skltn>
            </ng-container>

            <ng-template #checkNoData>
              <ng-container *ngIf="dataSource?.data?.length === 0; else showTable">
                <app-no-data message="No Project(s) found at this moment !!"></app-no-data>
              </ng-container>
            </ng-template>
             <ng-template #showTable>
            
              <div  class="mat-elevation-z8">                     
                <table mat-table [dataSource]="dataSource" matSort >

                  <ng-container matColumnDef="serial">
                    <th mat-header-cell *matHeaderCellDef> Sr. No. </th>
                    <td mat-cell *matCellDef="let row"> {{row.srno}} </td>
                  </ng-container>
                  <!-- contractName Column -->
                  <ng-container matColumnDef="code">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Project Code </th>
                    <td mat-cell *matCellDef="let row"> {{row.projectcode}} </td>
                  </ng-container>

                  <!-- Name Column -->
                  <ng-container matColumnDef="shortname">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Project Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.projectshortname}} </td>
                  </ng-container>

                  <!-- con_personName Column -->
                  <ng-container matColumnDef="location">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Location </th>
                    <td mat-cell *matCellDef="let row"> {{row.projectlocation}} </td>
                  </ng-container>
                  <!-- con_personName Column -->
                  <ng-container matColumnDef="clientname">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Client Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.client}} </td>
                  </ng-container>
                  <!-- con_personName Column -->
                  <ng-container matColumnDef="concernpersonname">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Concern Person </th>
                    <td mat-cell *matCellDef="let row"> {{row.concernpersonname}} </td>
                  </ng-container>
                  <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                    <td mat-cell *matCellDef="let element"> 
                      <app-view-btn (click)="view(element)"></app-view-btn>
                    </td>
                  </ng-container>
                   <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    
                    <!-- Row shown when there is no matching data. -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                        No Project found at this moment.</td>
                    </tr>
               
                </table>
                <mat-paginator [length]="resultsLength" [pageSize]="pageSize" 
                  [pageSizeOptions]="pagination" showFirstLastButtons></mat-paginator>
              </div>
            
            </ng-template>
        </mat-card-content>
    </mat-card>
</div>
<router-outlet></router-outlet>
