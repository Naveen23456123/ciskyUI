<div>
    <mat-card>
        <mat-card-content class="ps-0 pr-0">
          <div class="table-title-row">
            <div class="row col-md-12 content-center">
              <div class="col-md-9">
                <div>
                  <app-search-bar-controls  (OnAnyChange)="filterChange($event)" (OnClear)="clear()"
                    [isAny]="true" searchByAnyPlaceholder="Project Name / Invoice No." ></app-search-bar-controls>
                </div>  
            </div>       
            <div class="col-md-3 button-row main-btn-row d-flex justify-content-end">                            
              <!-- <button class="title-btn" type="button" routerLink="create"  mat-mini-fab color="primary">
                <mat-icon>add box</mat-icon> Invoice
              </button>                        -->
            </div>
            </div>
          </div>
          <ng-container *ngIf=" isLoading ; else checkNoData">
            <app-empty-table-skltn></app-empty-table-skltn>
          </ng-container>
          <ng-template #checkNoData>
            <ng-container *ngIf="dataSource?.data?.length === 0; else showTable">
              <app-no-data message="No Project(s) found at this moment !!"></app-no-data>
            </ng-container>
          </ng-template>
          <ng-template #showTable> 
          <div class=""> 
            <div class="mat-elevation-z8 table-container">
                <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
            
                <ng-container matColumnDef="serial">
                  <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                  <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                </ng-container>
            
                <!-- contractName Column -->
                <ng-container matColumnDef="projectid">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Project Code </th>
                  <td mat-cell *matCellDef="let row"> {{row.projectcode}} </td>
                </ng-container>                      
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Project Name </th>
                  <td mat-cell *matCellDef="let row"> {{row.projectshortname}} </td>
                </ng-container>  
                <!-- con_personName Column -->
                <ng-container matColumnDef="view">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> View </th>
                  <td mat-cell *matCellDef="let row">                           
                    <app-view-btn [state]="row"
                    [routerLink]="['/invoice/inv-list']"></app-view-btn>  
                  </td>
                </ng-container>
                
              
                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr> 
                <tr class="mat-row" *matNoDataRow>
                  <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                    No Project(s) detail found at this moment.</td>
                </tr>
              </table>
              <mat-paginator [length]="resultsLength" [pageSize]="pageSize" 
                [pageSizeOptions]="pagination" showFirstLastButtons></mat-paginator>
            </div>     
          </div>
          </ng-template>
        </mat-card-content>
    </mat-card>
</div>
<router-outlet></router-outlet>
