<div class="container">
    <mat-card>
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div *ngIf="!isLoading">     
                <div class="mat-elevation-z8">                
                  <div class="table-title-row">
                    <div class="row  content-center">
                      <div class="col-md-10">
                        <div *ngIf="showFilters">
                          <app-search-bar-controls [isSubCompany]="true" [isProfessional]="true" [isDesignation]="true"
                          [isProjects]="true" [isAny]="true" searchByAnyPlaceholder="Employee Code / Name"
                          (OnProjectChange)="projectChange($event)" (OnDesignationChange)="desgChange($event)" 
                          (OnSubCompanyChange)="compChange($event)" (OnProfessionalChange)="professionalChange($event)"
                           (OnAnyChange)="anyChange($event)" 
                          ></app-search-bar-controls>
                        </div>  
                    </div>       
                    <div class="col-md-2 button-row main-btn-row d-flex justify-content-end">
                      <app-upload-btn (clickEvent)="import()" ></app-upload-btn>          
                      <button class="title-btn" type="button" (click)="add_emp()"  mat-mini-fab color="primary">
                        <mat-icon>add box</mat-icon> Employee
                      </button> 
                      <app-download-csv (clickEvent)="export()" ></app-download-csv> 
                    </div>
                  </div>
                </div>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
    <div class="wrapper">
    <mat-card>
      <mat-card-content>
        <div class="load-wrap" *ngIf="isSearching">
          <app-loader [IsLoading]="isSearching"></app-loader>
      </div>
        <app-no-data *ngIf="!isLoading && dataSource?.data?.length==0 && !isSearching"  message="No Employee(s) Details found at this moment !!" ></app-no-data>
        <div *ngIf="dataSource?.data?.length!=0"  class="mat-elevation-z8">        
          <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
              
                  <ng-container matColumnDef="serial">
                    <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                    <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                  </ng-container>
                    <!-- contractName Column -->
                    <ng-container matColumnDef="code">
                      <th mat-header-cell *matHeaderCellDef mat-sort-header> Code </th>
                      <td mat-cell *matCellDef="let row"> {{row.code}} </td>
                    </ng-container>
              
                  <!-- contractName Column -->
                  <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                  </ng-container>
              
                  <!-- Name Column -->
                  <ng-container matColumnDef="designation">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Designation </th>
                    <td mat-cell *matCellDef="let row"> {{row.designation}} </td>
                  </ng-container>
              
                  <!-- con_personName Column -->
                  <ng-container matColumnDef="emailid">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                    <td mat-cell *matCellDef="let row"> {{row.emailid}} </td>
                  </ng-container>
                  <!-- con_personName Column -->
                  <ng-container matColumnDef="phonenumber">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Phone Number </th>
                    <td mat-cell *matCellDef="let row"> {{row.phonenumber}} </td>
                  </ng-container>
                  <!-- con_personName Column -->
                  <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                    <td  mat-cell class="action-col-3" *matCellDef="let row"> 
                      <div class="button-row"> 
                        <app-view-btn [routerLink]="['/employees/view',row.id]" [state]="row"></app-view-btn>                
                        <app-edit-btn (clickEvent)="edit_emp(row)" ></app-edit-btn>                              
                        <app-delete-btn (clickEvent)="delete_emp(row)"></app-delete-btn>
                      </div>
                   </td>
                  </ng-container>
                  <ng-container matColumnDef="doc">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Document(s) </th>
                    <td  mat-cell *matCellDef="let row"> 
                      <div class="button-row">         
                        <app-document-manage-btn (clickEvent)="viewdoc(row.id)"></app-document-manage-btn>                                       
                        
                      </div>
                   </td>
                  </ng-container>
                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr> 
                  <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                      No Employees Details found at this moment.</td>
                  </tr>
          </table>
          <mat-paginator [length]="resultsLength" [pageSize]="pageSize" [pageSizeOptions]="pagination" showFirstLastButtons>
          </mat-paginator>
        </div>   
      </mat-card-content>
    </mat-card>
    </div>
</div>
<router-outlet></router-outlet>
