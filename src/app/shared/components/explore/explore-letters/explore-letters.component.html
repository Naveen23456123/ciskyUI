<div class="mat-elevation-z8">
    <app-no-data *ngIf="dataSource?.data?.length==0" message="No Letter(s) found at this moment !!" ></app-no-data>
    <div *ngIf="dataSource?.data?.length!=0"  class="mat-elevation-z8">   
        <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
                      
            <ng-container matColumnDef="serial">
              <th mat-header-cell *matHeaderCellDef> Sr. No </th>
              <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
            </ng-container>
        
            <!-- contractName Column -->
            <ng-container matColumnDef="letterno">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Letter No.</th>
              <td mat-cell *matCellDef="let row"> {{row.letternumber}} </td>
            </ng-container>
        
            <!-- Name Column -->
            <ng-container matColumnDef="lettertype">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Letter Type </th>
              <td mat-cell *matCellDef="let row"> {{row.lettertype}} </td>
            </ng-container>                      
          
            <ng-container matColumnDef="letterdate">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Letter Date </th>
              <td mat-cell *matCellDef="let row">{{row.letterdate | formatDate }} </td>
            </ng-container>
            <ng-container matColumnDef="subject">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Subject</th>
              <td mat-cell *matCellDef="let row">{{row.subject}} </td>
            </ng-container>
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Status</th>
              <td mat-cell *matCellDef="let row">{{row.status}} </td>
            </ng-container>
            <ng-container matColumnDef="view">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Details</th>
              <td mat-cell *matCellDef="let row">
                <app-view-btn (clickEvent)="viewletter(row.id)"></app-view-btn>
              </td>
            </ng-container>                            
            <tr mat-header-row *matHeaderRowDef="letterdisplayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: letterdisplayedColumns;"></tr>
                       
          </table>
    </div>
</div>
