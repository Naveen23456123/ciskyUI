<div class="container">
    
    <mat-card>       
        <mat-card-content>
          <div class="table-title-row control-div">
              <h4 class="sub-heading">Insurance</h4>      
              <div class="button-row">              
                <app-upload-btn (clickEvent)="import()" ></app-upload-btn>

                <button class="title-btn" type="button" (click)="add()"  mat-mini-fab color="primary">
                    <mat-icon>add box</mat-icon> Insurance
                </button> 
                <app-download-csv (clickEvent)="export()" ></app-download-csv> 
            </div>
          </div> 
            <ng-container *ngIf=" isLoading; else checkNoData">
            <app-empty-table-skltn></app-empty-table-skltn>
          </ng-container>
          <ng-template #checkNoData>
            <ng-container *ngIf="dataSource?.data?.length === 0; else showTable">
              <app-no-data message="No Insurance found at this moment !!"></app-no-data>
            </ng-container>
          </ng-template>
          <ng-template #showTable>
            <div class="wrapper" >   
                <div class="mat-elevation-z8">                   
                      
                      <div  class="mat-elevation-z8">  
                        <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
                      
                          <ng-container matColumnDef="serial">
                            <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                            <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                          </ng-container>
                      
                          <!-- contractName Column -->
                          <ng-container matColumnDef="policyno">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Policy No. </th>
                            <td mat-cell *matCellDef="let row"> {{row.policynumber}} </td>
                          </ng-container>
                      
                          <!-- Name Column -->
                          <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Insurance Name </th>
                            <td mat-cell *matCellDef="let row"> {{row.insurancename}} </td>
                          </ng-container>                      
                        
                          <ng-container matColumnDef="amount">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
                            <td mat-cell *matCellDef="let row">{{row.amount |formatCurrency}} </td>
                          </ng-container>
                          
                          <ng-container matColumnDef="startdate">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Start Date</th>
                            <td mat-cell *matCellDef="let row">{{row.startdate  | formatDate}} </td>
                          </ng-container> 
                          <ng-container matColumnDef="enddate">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> End Date</th>
                            <td mat-cell *matCellDef="let row">{{row.enddate  | formatDate}} </td>
                          </ng-container> 
                          <ng-container matColumnDef="file">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> File</th>
                            <td mat-cell *matCellDef="let row">                            
                              <app-file-icon [link]="!!row.docaddress" (clickEvent)="viewPdf(row.docaddress)"></app-file-icon>
                             </td>
                          </ng-container> 
                          <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Action</th>
                            <td class="action-col" mat-cell *matCellDef="let row">
                              <div class="button-row">                              
                                <app-edit-btn (clickEvent)="edit_ins(row)" ></app-edit-btn>                              
                                <app-delete-btn (clickEvent)="delete_ins(row)"></app-delete-btn>
                              </div>
                            </td>
                          </ng-container> 
                          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                          
                          <!-- Row shown when there is no matching data. -->
                          <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                              No Insurance details are found at this moment.</td>
                          </tr>
                        </table>
                        <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="pagination" showFirstLastButtons>
                        </mat-paginator>
                        <!-- <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator> -->
                      </div>
                      
                      
                </div>
            </div>
            </ng-template>
        </mat-card-content>
    </mat-card>
</div>
