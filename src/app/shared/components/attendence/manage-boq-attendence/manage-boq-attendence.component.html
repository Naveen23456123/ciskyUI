<div class="dialog" >
    <mat-card *ngIf="!deleteboq">
        <h3 mat-dialog-title class="justify-content-between align-items-center"> {{title}} 
            <button class="popup-close-btn float-end" mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
          </button> 
        </h3> 
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="wrapper">
                <form [formGroup]="boqForm" (submit)="submit()">
                    <app-alert-badge *ngIf="message" [isError]="true" [message]="message"></app-alert-badge>
                    <div class="row control-div">
                        <div class="col-md-6">
                            <app-project-control (onValueChange)="projectChange($event)"
                            [defaultValue]="boqForm.get('projectid')?.value" ></app-project-control>
                        </div>
                        <div class="col-md-6">                            
                            <app-select-search *ngIf="empInit"  [defaultValue]="boqForm.get('employeeid')?.value"
                            searchPlaceholder="Search Employee" emptySearchMessage="No Employee Found"
                              label="Select Employee" [required]="true" selectPlaceholder="Employee(s)"
                            (onValueChange)="empSelect($event)" [valueArrays]="employeeList">
                            </app-select-search> 
                        </div>
                        <div class="col-md-6">
                            <mat-form-field>
                                <mat-label>Total Days</mat-label>
                                <input matInput type="number" formControlName="totaldays">
                                <mat-error>Please enter First Name.</mat-error>
                            </mat-form-field>
                        </div>
                      
                        <div class="col-md-6">
                            <mat-form-field>
                                <mat-label>Man Months</mat-label>
                                <input matInput type="number" formControlName="manmonths">
                                <mat-error>Please enter First Name.</mat-error>
                            </mat-form-field>
                        </div>   
                        <div class="col-md-6">
                            <app-month-and-year-picker [defaultValue]="boqForm.get('monthandyear')?.value" (onValueChange)="dateChange($event)" ></app-month-and-year-picker>
                           
                        </div>
                                                  
                    </div> 
                       
                    <div class="row control-div">
                        <div class="col-md-12 button-row" align="right">
                            <button class="cancel-btn" mat-stroked-button mat-dialog-close color="default">Cancel</button>
                            <button class="submit-btn" mat-flat-button [disabled]="!boqForm.valid" color="primary">
                                {{isEdit?'Update':'Submit'}}</button>
                        </div>
                    </div> 
                </form>
            </div>
        </mat-card-content>
    </mat-card>
    <mat-card *ngIf="deleteboq">      
        <mat-card-title class="card-title d-flex justify-content-center" >
            <mat-icon>warning</mat-icon><span>{{title}}</span>
        </mat-card-title>
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="wrapper">
                <mat-dialog-content>
                    <span class="mat-typography alert-content">
                        Are you sure you want to delete <span class="vw-lbl">{{boqForm.controls['employeeid'].value}}</span> ?. This operation can
                        not be un-done once performed sucessfully.
                    </span>
                </mat-dialog-content>
                <mat-dialog-actions align="center">
                    <div class="control-div">
                        <button class="delete-btn" mat-raised-button (click)="delete()" color="primary">
                            Delete
                        </button>
                        <button class="cancel-btn" mat-stroked-button color="default" mat-dialog-close>
                            Cancel
                        </button>
                    </div>
                </mat-dialog-actions>
            </div>
        </mat-card-content>
    </mat-card>
</div>
