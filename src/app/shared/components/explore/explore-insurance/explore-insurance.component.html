<div class="mat-elevation-z8">
    <app-no-data *ngIf="dataSource?.data?.length==0" message="No Insurance found at this moment !!" ></app-no-data>
    <div *ngIf="dataSource?.data?.length!=0"  class="mat-elevation-z8">    
    <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
  
      <ng-container matColumnDef="serial">
        <th mat-header-cell *matHeaderCellDef> Sr. No </th>
        <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
      </ng-container>
  
      <!-- contractName Column -->
      <ng-container matColumnDef="policyno">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Policy No. </th>
        <td mat-cell *matCellDef="let row"> {{row.policynumber}} </td>
      </ng-container>
  
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Insurance Name </th>
        <td mat-cell *matCellDef="let row"> {{row.insurancename}} </td>
      </ng-container>                      
    
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
        <td mat-cell *matCellDef="let row">{{row.amount |formatCurrency}} </td>
      </ng-container>
      
      <ng-container matColumnDef="startdate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Start Date</th>
        <td mat-cell *matCellDef="let row">{{row.startdate  | formatDate}} </td>
      </ng-container> 
      <ng-container matColumnDef="enddate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> End Date</th>
        <td mat-cell *matCellDef="let row">{{row.enddate  | formatDate}} </td>
      </ng-container> 
      <ng-container matColumnDef="file">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> File</th>
        <td mat-cell *matCellDef="let row">                            
          <app-file-icon [link]="row.docaddress"></app-file-icon>
         </td>
      </ng-container> 
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
    </table>
    <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="pagination" showFirstLastButtons>
    </mat-paginator>
  
  </div>
</div>
