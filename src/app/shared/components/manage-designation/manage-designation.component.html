<div class="dialog" >
    <mat-card *ngIf="!deleteDesignation">
        <h3 mat-dialog-title class="justify-content-between align-items-center"> {{title}} 
            <button class="popup-close-btn float-end" mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
          </button> 
        </h3>
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="wrapper">
                <form [formGroup]="designationForm" (submit)="submit()">
                    <div class="row control-div">
                        <div class="col-md-12">
                            <mat-form-field>
                                <mat-label>Name</mat-label>
                                <input matInput formControlName="name">
                                <mat-error>Please enter designation Name.</mat-error>
                            </mat-form-field>
                        </div>    
                        <div class="col-md-12">
                            <mat-form-field>
                                <mat-label>Sub Company Name</mat-label>
                                <mat-select formControlName="companyid">
                                    <mat-option  *ngFor="let field of subCompanyList" [value]="field.id">
                                        {{field.name}}
                                    </mat-option>
                                </mat-select>
                                <mat-error>Please select Sub company.</mat-error>
                            </mat-form-field>
                        </div>  
                        <div class="col-md-12 button-row" align="right">
                                <button class="cancel-btn" mat-stroked-button mat-dialog-close color="default">Cancel</button>
                                <button [ngClass]="designationForm.valid? 'submit-btn':''" mat-flat-button [disabled]="!designationForm.valid" color="primary">
                                    {{isEdit?'Update':'Submit'}}</button>
                        </div>
                        
                    </div>
                    
                </form>
            </div>
        </mat-card-content>
    </mat-card>
    <mat-card *ngIf="deleteDesignation">      
        <mat-card-title class="card-title d-flex justify-content-center" >
            <mat-icon>warning</mat-icon><span>{{title}}</span>
        </mat-card-title>
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="wrapper">
                <mat-dialog-content>
                    <span class="mat-typography alert-content">
                        Are you sure you want to delete <span class="vw-lbl">{{designationForm.controls['name'].value}}</span> ?. This operation can
                        not be un-done once performed sucessfully.
                    </span>
                </mat-dialog-content>
                <mat-dialog-actions align="center">
                    <div class="control-div">
                        <button class="delete-btn" mat-raised-button (click)="delete()" color="primary">
                            Delete
                        </button>
                        <button class="cancel-btn" mat-stroked-button color="default" mat-dialog-close>
                            Cancel
                        </button>
                    </div>
                </mat-dialog-actions>
            </div>
        </mat-card-content>
    </mat-card>
</div>
