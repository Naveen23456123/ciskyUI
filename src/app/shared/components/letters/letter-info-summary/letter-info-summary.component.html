<div class="dialog" >
  <mat-card >
      <h3 mat-dialog-title class="justify-content-between align-items-center"> Letters
          <button class="popup-close-btn float-end" mat-icon-button mat-dialog-close>
          <mat-icon>close</mat-icon>
        </button> 
      </h3> 
      <mat-dialog-content class="mat-typography"> 
        <mat-card-content>
            <div class="load-wrap" *ngIf="isLoading">
                <app-loader [IsLoading]="isLoading"></app-loader>
            </div>
            <div class="wrapper" *ngIf="!isLoading">                

                <div class="mat-elevation-z8">
                  <div class="row  content-center">
                    <div class="col-md-8">
                        <span class="sub-heading">{{ownerName}} : </span>
                        <span class="sub-heading">{{lettertype}}</span>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="float-end" >
                        <mat-icon matPrefix>search</mat-icon>
                        <mat-label>Letter Number / Type / Subject</mat-label>
                        <input matInput (keyup)="applyFilter($event)"  #input>
                      </mat-form-field>  
                  </div>       
                  <div class="col-md-7 button-row main-btn-row d-flex justify-content-end">
                     
                  </div>
                </div>
                      
                    <app-no-data *ngIf="dataSource?.data?.length==0" message="No Letter(s) found at this moment !!" ></app-no-data>
                    <div *ngIf="dataSource?.data?.length!=0"  class="mat-elevation-z8">     
                        <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
                      
                          <ng-container matColumnDef="serial">
                            <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                            <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                          </ng-container>
                      
                          <!-- contractName Column -->
                          <ng-container matColumnDef="letterno">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Letter No.</th>
                            <td mat-cell *matCellDef="let row"> {{row.letternumber}} </td>
                          </ng-container>
                      
                          <!-- Name Column -->
                          <ng-container matColumnDef="lettertype">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Letter Type </th>
                            <td mat-cell *matCellDef="let row"> {{row.lettertype}} </td>
                          </ng-container>                      
                        
                          <ng-container matColumnDef="letterdate">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Letter Date </th>
                            <td mat-cell *matCellDef="let row">{{row.letterdate | formatDate }} </td>
                          </ng-container>
                          <ng-container matColumnDef="subject">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Subject</th>
                            <td mat-cell *matCellDef="let row">{{row.subject}} </td>
                          </ng-container>
                          <ng-container matColumnDef="status">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Status</th>
                            <td mat-cell *matCellDef="let row">
                              <app-status-badge  [value]="row.status" [label]="row.status"></app-status-badge>  
                            </td>
                          </ng-container> 
                          <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> View</th>
                            <td mat-cell class="action-col-3" *matCellDef="let row"> 
                              <div class="button-row">     
                                <app-view-btn (clickEvent)="viewletter(row.id)"></app-view-btn>                          
                                
                              </div>
                            </td>
                          </ng-container>
                          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                          
                          <!-- Row shown when there is no matching data. -->
                          <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                              No Letters Details found at this moment.</td>
                          </tr>
                        </table>
                       </div>
                </div>
            </div>
        </mat-card-content>
        </mat-dialog-content>
    </mat-card>
</div>
