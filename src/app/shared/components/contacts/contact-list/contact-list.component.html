<div class="container">
    
    <mat-card>
        <mat-card-title>
            <div class="card-title-row">
                <span class="sub-heading">Contact(s)</span>                
              </div>
        </mat-card-title>
        <mat-card-content>
          <div class="table-title-row">
              <mat-form-field>
                <mat-label>Filter</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="" #input>
              </mat-form-field>
              <div class="button-row">              
                <app-upload-btn (clickEvent)="import()" ></app-upload-btn>

                <button class="title-btn" type="button" (click)="add()"  mat-mini-fab color="primary">
                    <mat-icon>add box</mat-icon> Contact
                </button> 
                <app-download-csv (clickEvent)="export()" ></app-download-csv> 
            </div>
          </div> 
          <ng-container *ngIf=" isLoading; else checkNoData">
            <app-empty-table-skltn></app-empty-table-skltn>
          </ng-container>
          <ng-template #checkNoData>
            <ng-container *ngIf="dataSource?.data?.length === 0; else showTable">
              <app-no-data message="No Contact found at this moment !!"></app-no-data>
            </ng-container>
          </ng-template>
          <ng-template #showTable>
              <div class="mat-elevation-z8">
                <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
              
                  <ng-container matColumnDef="serial">
                    <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                    <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                  </ng-container>
              
                  <!-- contractName Column -->
                  <ng-container matColumnDef="contacttype">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Contact Type </th>
                    <td mat-cell *matCellDef="let row"> {{row.type}} </td>
                  </ng-container>
              
                  <!-- Name Column -->
                  <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                  </ng-container>                      
                
                  <ng-container matColumnDef="designationname">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Designation  </th>
                    <td mat-cell *matCellDef="let row">{{row.designation}} </td>
                  </ng-container>
                  
                  <ng-container matColumnDef="contactno">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Contact No.</th>
                    <td mat-cell *matCellDef="let row">
                        <span> {{row.phoneno}}</span> <br> 
                        <span>{{row.alternatephoneno}}</span>
                    </td>
                  </ng-container> 
                  <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                    <td mat-cell *matCellDef="let row">
                        {{row.email}} </td>
                  </ng-container>
                  
                  <ng-container matColumnDef="branchname">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Branch </th>
                    <td mat-cell *matCellDef="let row">{{row.branch}} </td>
                  </ng-container> 
                  <ng-container matColumnDef="address">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Address</th>
                    <td mat-cell *matCellDef="let row">{{row.address}} </td>
                  </ng-container> 
                  <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Action</th>
                    <td mat-cell *matCellDef="let row">
                        <div class="button-row">                               
                          <app-edit-btn (clickEvent)="edit_contact(row)" ></app-edit-btn>                              
                          <app-delete-btn (clickEvent)="delete_contact(row)"></app-delete-btn>
                        </div>
                    </td>
                  </ng-container> 
                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                  
                  <!-- Row shown when there is no matching data. -->
                  <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                      No Contact Details found at this moment.</td>
                  </tr>
                </table>
                <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="pagination" showFirstLastButtons>
                </mat-paginator>
                <!-- <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator> -->
              </div>
            </ng-template>
        </mat-card-content>
    </mat-card>
</div>
