<div class="mat-elevation-z8">
    <app-no-data *ngIf="dataSource?.data?.length==0" message="No Bank Guarantee found at this moment !!" ></app-no-data>
    <div *ngIf="dataSource?.data?.length!=0"  class="mat-elevation-z8">  
    <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
  
      <ng-container matColumnDef="serial">
        <th mat-header-cell *matHeaderCellDef> Sr. No </th>
        <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
      </ng-container>
  
      <!-- contractName Column -->
      <ng-container matColumnDef="bankname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Bank Name </th>
        <td mat-cell *matCellDef="let row"> {{row.bankname}} </td>
      </ng-container>
  
      <!-- Name Column -->
      <ng-container matColumnDef="guranteename">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Guarantee No. </th>
        <td mat-cell *matCellDef="let row"> {{row.guaranteenumber}} </td>
      </ng-container>                      
    
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
        <td mat-cell *matCellDef="let row">{{row.amount}} </td>
      </ng-container>
      
      <ng-container matColumnDef="startdate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Guarantee Date</th>
        <td mat-cell *matCellDef="let row">{{row.guaranteedate  | formatDate}} </td>
      </ng-container> 
      <ng-container matColumnDef="expirydate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Expiry Date</th>
        <td mat-cell *matCellDef="let row">{{row.guaranteeexpirydate  | formatDate}} </td>
      </ng-container>
      <ng-container matColumnDef="releasedate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Release Date</th>
        <td mat-cell *matCellDef="let row">{{row.releasedate  | formatDate}} </td>
      </ng-container> 
    
      <ng-container matColumnDef="remarks">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Remarks</th>
        <td mat-cell *matCellDef="let row">{{row.remark}} </td>
      </ng-container> 
      <ng-container matColumnDef="file">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> File</th>
        <td mat-cell *matCellDef="let row"> 
          <app-file-icon [link]="row.docaddress"></app-file-icon>
        </td>
      </ng-container> 
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            
    </table>
    <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="pagination" showFirstLastButtons>
    </mat-paginator>   
  </div>
</div>
