<div class="container">
   <mat-card >
    <mat-card-content>
        <div class="load-wrap" *ngIf="isLoading">
            <app-loader [IsLoading]="isLoading"></app-loader>
        </div>
        <div *ngIf="!isLoading">     
            <div class="mat-elevation-z8"> 
              <div class="row content-center">
                <div class="col-md-9">
                   <app-search-bar-controls  [isAny]="true"
                    (OnAnyChange)="filterChange($event)" (OnClear)="clear()"
                    searchByAnyPlaceholder="Company / Name" ></app-search-bar-controls>                  
              </div>       
              <div class="col-md-3 button-row main-btn-row d-flex justify-content-end">
                <button class="title-btn" type="button" routerLink="create"  mat-mini-fab color="primary">
                            <mat-icon>add box</mat-icon> Approval
                        </button> 
              </div>
            </div> 
            </div>
        </div>
    </mat-card-content>
  </mat-card>
    <mat-card class="wrapper">
        <mat-card-content>            
                <div class="mat-elevation-z8">  
                <ng-container *ngIf="isLoading ; else checkNoData">
                  <app-empty-table-skltn></app-empty-table-skltn>
                </ng-container>
                <ng-template #checkNoData>
                  <ng-container *ngIf="dataSource?.data?.length === 0; else showTable">
                    <app-no-data message="No Approval found at this moment !!"></app-no-data>
                  </ng-container>
                </ng-template>
                <ng-template #showTable>                    
                    <div  class="mat-elevation-z8 table-container">     
                        <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
                      
                          <ng-container matColumnDef="serial">
                            <th mat-header-cell *matHeaderCellDef> Sr. No </th>
                            <td mat-cell *matCellDef="let index = renderIndex"> {{index+1}} </td>
                          </ng-container>
                      
                         <ng-container matColumnDef="cname">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Company </th>
                            <td mat-cell *matCellDef="let row"> {{row.company}} </td>
                          </ng-container>     
                          <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                            <td mat-cell *matCellDef="let row"> {{row.modulename}} </td>
                          </ng-container>                      
                         
                          <ng-container matColumnDef="view">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Levels </th>
                            <td mat-cell *matCellDef="let row"> 
                            <div class="row">

                              <div class="col-md-4" *ngFor="let item of row.levels">
                                   <h6>{{item.rolename}}</h6>
                                   <h5>{{item.employeename}}</h5>
                              </div>
                            </div>  
                            </td>
                          </ng-container>
                          <!-- con_personName Column -->
                          <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
                            <td mat-cell *matCellDef="let row"> 
                              <div class="button-row">                              
                                <app-edit-btn [routerLink]="['/approval/edit',row.id]" [state]="row" ></app-edit-btn>                              
                                <app-delete-btn [state]="row" [routerLink]="['/approval/delete',row.id]" ></app-delete-btn>
                          </div>
                           </td>
                          </ng-container>
                        
                          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
                          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr> 
                         <tr class="mat-row" *matNoDataRow>
                          <td class="mat-cell no-data-cell"  attr.colspan="{{ displayedColumns.length }}">
                            No Approval found at this moment.</td>
                        </tr>
                        </table>
                        <mat-paginator [length]="resultsLength" [pageSize]="pageSize" 
                          [pageSizeOptions]="pagination" showFirstLastButtons></mat-paginator>
                      </div>  
                      </ng-template> 
                </div>
        </mat-card-content>
    </mat-card>
</div>
<router-outlet></router-outlet>
